<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tempo</title>
<meta name="description" content="Assistente personale per la gestione del tempo: parla con il tuo tempo.">
<meta name="theme-color" content="#F5F3EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <!-- CHAT / HOME -->
  <section id="view-chat" class="view active" aria-label="Chat">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow" id="today-label"></div>
          <h1 class="title">Tempo</h1>
        </div>
        <button class="icon-btn" id="undo-btn" aria-label="Annulla ultima modifica" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        </button>
      </div>
      <button class="summary" id="summary" aria-label="Apri la giornata">
        <div class="sum-now">
          <span class="sum-tag" id="sum-tag">Adesso</span>
          <span class="sum-title" id="sum-title">Giornata libera</span>
          <span class="sum-time" id="sum-time"></span>
        </div>
        <div class="sum-meta">
          <span id="sum-next"></span>
          <span class="sum-free" id="sum-free"></span>
        </div>
        <div class="sum-bar"><i id="sum-bar"></i></div>
      </button>
    </header>
    <main class="chat" id="chat" aria-live="polite"></main>
    <form class="composer" id="composer" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="composer-row">
        <textarea id="input" rows="1" placeholder="Dimmi cosa devi fare…" enterkeyhint="send" aria-label="Messaggio"></textarea>
        <button type="submit" class="send" id="send" aria-label="Invia">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- TIMELINE -->
  <section id="view-day" class="view" aria-label="Giornata">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow" id="day-eyebrow"></div>
          <h1 class="title" id="day-title">Oggi</h1>
        </div>
        <button class="icon-btn" id="add-btn" aria-label="Aggiungi">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="days" id="days" role="tablist"></div>
    </header>
    <main class="timeline-wrap" id="timeline-wrap">
      <div class="notices" id="notices"></div>
      <div class="timeline" id="timeline"></div>
    </main>
  </section>

  <!-- IMPOSTAZIONI -->
  <section id="view-settings" class="view" aria-label="Impostazioni">
    <header class="top"><div class="top-row"><div><div class="eyebrow">Tempo</div><h1 class="title">Memoria</h1></div></div></header>
    <main class="settings" id="settings"></main>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-view="chat" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span>Parla</span></button>
    <button data-view="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2v4M16 2v4M4 10h16M8 14h5M8 17h8"/></svg><span>Giornata</span></button>
    <button data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Memoria</span></button>
  </nav>
</div>

<!-- Scheda modifica -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grabber"></div>
  <form id="sheet-form"></form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
