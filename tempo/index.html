<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tempo</title>
<meta name="description" content="Assistente personale per la gestione del tempo: parla con il tuo tempo.">
<meta name="theme-color" content="#F3E4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1320" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="app">
  <!-- GIORNO: saluto + carte -->
  <section id="day" class="layer" aria-label="Giornata">
    <div class="topbar">
      <button class="round" id="to-overview" aria-label="Tutti i giorni">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="4" y="4" width="16" height="6.5" rx="2.2"/><rect x="4" y="13.5" width="16" height="6.5" rx="2.2"/></svg>
      </button>
      <div class="topbar-right">
        <button class="round" id="undo-btn" aria-label="Annulla ultima modifica" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button class="round" id="open-settings" aria-label="Impostazioni e memoria">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </div>
    <main class="day-scroll" id="day-scroll">
      <header class="hero" id="hero">
        <div class="hero-time" id="hero-time"></div>
        <h1 class="hero-title" id="hero-title"></h1>
      </header>
      <div class="collage" id="collage"></div>
    </main>
  </section>

  <!-- SETTIMANA / MESE -->
  <section id="overview" class="layer" aria-label="Settimana e mese" hidden>
    <div class="ov-head">
      <div class="ov-top">
        <button class="round" id="ov-back" aria-label="Torna al giorno">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
        </button>
        <span class="ov-kicker" id="ov-title">Il tuo piano</span>
        <button class="pill-btn" id="ov-today">Oggi</button>
      </div>
      <div class="ov-range">
        <h2 id="ov-range"></h2>
        <div class="ov-nav" id="ov-nav">
          <button type="button" id="wk-prev" aria-label="Settimana precedente"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg></button>
          <button type="button" id="wk-next" aria-label="Settimana successiva"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></button>
        </div>
      </div>
      <div class="ov-seg" role="tablist" aria-label="Vista">
        <button type="button" role="tab" data-ovmode="day" aria-selected="false">Giorno</button>
        <button type="button" role="tab" data-ovmode="week" aria-selected="true" class="on">Settimana</button>
        <button type="button" role="tab" data-ovmode="month" aria-selected="false">Mese</button>
      </div>
      <div class="months" id="months" hidden></div>
    </div>
    <main class="ov-scroll" id="ov-scroll"></main>
    <main class="cal-scroll" id="cal-scroll" hidden></main>
  </section>

  <!-- bagliore dietro la barra (ispirato a Maike) -->
  <div class="glow" aria-hidden="true"><div class="gf floor"><i></i></div></div>

  <!-- BARRA PER PARLARE CON L'AI -->
  <form class="bar" id="composer" autocomplete="off">
    <div class="mini-sum" id="mini-sum"></div>
    <div class="reply" id="reply" hidden></div>
    <div class="plus-menu" id="plus-menu" hidden>
      <button type="button" data-plus="task"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M12 10v6M9 13h6"/></svg>Nuova attività</button>
      <button type="button" data-plus="photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>Attività con foto</button>
    </div>
    <div class="bar-row">
      <button type="button" class="bar-btn" id="plus" aria-label="Aggiungi">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <textarea id="input" rows="1" placeholder="Scrivi a Tempo…" enterkeyhint="send" aria-label="Messaggio"></textarea>
      <button type="button" class="bar-btn" id="mic" aria-label="Detta" hidden>
        <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="send" id="send" aria-label="Invia">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
      </button>
    </div>
  </form>

  <!-- PRESENTAZIONE: obiettivi, vincoli, progetti, preferenze -->
  <section id="onb" role="dialog" aria-modal="true" aria-label="Presentazione" hidden>
    <div class="onb-top"><div class="onb-dots" id="onb-dots" aria-hidden="true"></div><button type="button" class="onb-skip" id="onb-skip">Salta</button></div>
    <div class="onb-body" id="onb-body"></div>
    <button type="button" class="onb-next" id="onb-next">Iniziamo</button>
  </section>

  <!-- IMPOSTAZIONI -->
  <section id="panel" role="dialog" aria-label="Il tuo contesto" hidden>
    <div class="panel-head">
      <h2 class="serif">Il tuo contesto</h2>
      <button class="round" id="close-settings" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <main class="settings" id="settings"></main>
  </section>
</div>

<input type="file" id="photo-input" accept="image/*" hidden>

<!-- Scheda modifica -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grabber"></div>
  <form id="sheet-form"></form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
