<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' blob: data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tempo</title>
<meta name="description" content="Assistente personale per la gestione del tempo: parla con il tuo tempo.">
<meta name="theme-color" content="#F3E4EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1320" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Tinos:wght@700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<div id="app">
  <!-- spazio finito: resta finché il salvataggio non torna a funzionare -->
  <div class="save-alert" id="save-alert" role="alert" hidden>
    <p><b>Lo spazio per Tempo sul telefono è pieno.</b> Le ultime modifiche non sono salvate: esporta subito un backup.</p>
    <button type="button" class="btn primary" id="save-alert-export">Esporta il backup</button>
  </div>
  <!-- GIORNO: saluto + carte -->
  <section id="day" class="layer" aria-label="Giornata">
    <div class="topbar">
      <button class="round" id="to-overview" aria-label="Calendario"><i class="ic ic-grid" aria-hidden="true"></i></button>
      <div class="topbar-right">
        <button class="round" id="undo-btn" aria-label="Annulla ultima modifica" hidden>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button class="round" id="open-settings" aria-label="Impostazioni e memoria">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><circle cx="5.5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="18.5" cy="12" r="1.8"/></svg>
        </button>
      </div>
    </div>
    <main class="day-scroll" id="day-scroll">
      <header class="hero" id="hero">
        <div class="hero-time" id="hero-time"></div>
        <h1 class="hero-title" id="hero-title"></h1>
        <div class="hero-art" id="hero-art" hidden></div>
        <div class="focus-ctl" id="focus-ctl" hidden></div>
      </header>
      <div class="collage" id="collage"></div>
    </main>
  </section>

  <!-- CALENDARIO (si torna al giorno toccando un giorno) -->
  <section id="overview" class="layer" aria-label="Calendario" hidden>
    <div class="ov-head">
      <div class="ov-top">
        <button class="round today-btn" id="ov-today" aria-label="Torna a oggi"><small id="ov-today-wd"></small><b id="ov-today-n"></b></button>
        <h2 id="ov-title">Calendario</h2>
        <span class="ov-spacer" aria-hidden="true"></span>
      </div>
      <div class="months" id="months"></div>
    </div>
    <main class="cal-scroll" id="cal-scroll"></main>
  </section>

  <!-- RIEPILOGO: punti chiave e domande all'AI -->
  <section id="summary" class="layer" aria-label="Riepilogo" hidden>
    <div class="sum-head">
      <button class="round" id="sum-close" aria-label="Chiudi il riepilogo"><i class="ic ic-back" aria-hidden="true"></i></button>
      <span class="sum-title">Riepilogo</span>
      <span class="ov-spacer" aria-hidden="true"></span>
    </div>
    <main class="sum-scroll" id="sum-scroll" aria-live="polite"></main>
    <form class="ask" id="ask" autocomplete="off">
      <i class="ic ic-sum" aria-hidden="true"></i>
      <textarea id="ask-input" rows="1" placeholder="Chiedi a Tempo come sta andando…" enterkeyhint="send" aria-label="Domanda"></textarea>
      <button type="submit" class="send" id="ask-send" aria-label="Chiedi"><i class="ic ic-up" aria-hidden="true"></i></button>
    </form>
  </section>

  <!-- bagliore dietro la barra (ispirato a Maike) -->
  <div class="glow" aria-hidden="true"><div class="gf floor"><i></i></div></div>

  <!-- BARRA PER PARLARE CON L'AI -->
  <form class="bar" id="composer" autocomplete="off">
    <div class="mini-sum" id="mini-sum"></div>
    <div class="reply" id="reply" hidden></div>
    <div class="plus-menu" id="plus-menu" hidden>
      <button type="button" data-plus="task"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M12 10v6M9 13h6"/></svg>Nuova attività</button>
      <button type="button" data-plus="photo"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>Attività con foto</button>
    </div>
    <div class="bar-row">
      <button type="button" class="bar-btn" id="plus" aria-label="Parla con Tempo" aria-expanded="false"><i class="ic ic-plus" aria-hidden="true"></i></button>
      <textarea id="input" rows="1" placeholder="Scrivi a Tempo…" enterkeyhint="send" aria-label="Messaggio"></textarea>
      <button type="button" class="bar-btn" id="mic" aria-label="Detta" hidden><i class="ic ic-mic" aria-hidden="true"></i></button>
      <button type="submit" class="send" id="send" aria-label="Invia"><i class="ic ic-up" aria-hidden="true"></i></button>
    </div>
  </form>

  <!-- RIEPILOGO: nel calendario, in basso al centro -->
  <button type="button" class="sum-fab" id="sum-fab" aria-label="Riepilogo: come sta andando"><i class="ic ic-sum" aria-hidden="true"></i><span>Riepilogo</span></button>

  <!-- PRESENTAZIONE: obiettivi, vincoli, progetti, preferenze -->
  <section id="onb" role="dialog" aria-modal="true" aria-label="Presentazione" hidden>
    <div class="onb-top"><div class="onb-dots" id="onb-dots" aria-hidden="true"></div><button type="button" class="onb-skip" id="onb-skip">Salta</button></div>
    <div class="onb-body" id="onb-body"></div>
    <button type="button" class="onb-next" id="onb-next">Iniziamo</button>
  </section>

  <!-- IMPOSTAZIONI -->
  <section id="panel" role="dialog" aria-label="Il tuo contesto" hidden>
    <div class="panel-head">
      <h2 class="serif">Il tuo contesto</h2>
      <button class="round" id="close-settings" aria-label="Chiudi">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <main class="settings" id="settings"></main>
  </section>
</div>

<input type="file" id="photo-input" accept="image/*" hidden>

<!-- Scheda modifica -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grabber"></div>
  <form id="sheet-form"></form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
