<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Tempo</title>
<meta name="description" content="Assistente personale per la gestione del tempo: parla con il tuo tempo.">
<meta name="theme-color" content="#0D0920">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tempo">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="aurora" aria-hidden="true"><i class="a1"></i><i class="a2"></i><i class="a3"></i></div>

<div id="app">
  <!-- OGGI -->
  <section id="view-home" class="view active" aria-label="Oggi">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow" id="today-label"></div>
          <h1 class="title serif">Oggi</h1>
        </div>
        <div class="top-actions">
          <button class="icon-btn glass" id="undo-btn" aria-label="Annulla ultima modifica" disabled>
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>
          </button>
          <button class="avatar" data-goto="settings" aria-label="Memoria e impostazioni"><span id="avatar-letter">T</span></button>
        </div>
      </div>
    </header>
    <main class="scroll home" id="home">
      <div class="gauge" id="gauge">
        <svg viewBox="0 0 340 196" id="gauge-svg" aria-hidden="true"></svg>
        <div class="gauge-center">
          <b class="serif" id="gauge-pct">0%</b>
          <span id="gauge-label">della giornata</span>
        </div>
      </div>
      <div class="gauge-meta"><span id="gauge-free"></span><span id="gauge-done"></span></div>

      <h3 class="section">Adesso</h3>
      <div id="now-card"></div>

      <h3 class="section">Prossime <button class="link" data-goto="day">Vedi giornata</button></h3>
      <div class="stack" id="stack"></div>
      <button class="ask-pill glass" data-goto="chat" data-focus="1">
      <span class="spark">✦</span><span>Parla con Tempo…</span>
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
    </main>
  </section>

  <!-- PARLA -->
  <section id="view-chat" class="view" aria-label="Chat">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow" id="chat-mode"></div>
          <h1 class="title serif">Parla</h1>
        </div>
        <button class="avatar" data-goto="settings" aria-label="Memoria e impostazioni"><span class="avatar-letter">T</span></button>
      </div>
    </header>
    <main class="chat" id="chat" aria-live="polite"></main>
    <form class="composer" id="composer" autocomplete="off">
      <div class="chips" id="chips"></div>
      <div class="composer-row glass">
        <textarea id="input" rows="1" placeholder="Dimmi cosa devi fare…" enterkeyhint="send" aria-label="Messaggio"></textarea>
        <button type="submit" class="send" id="send" aria-label="Invia">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg>
        </button>
      </div>
    </form>
  </section>

  <!-- GIORNATA -->
  <section id="view-day" class="view" aria-label="Giornata">
    <header class="top">
      <div class="top-row">
        <div>
          <div class="eyebrow" id="day-eyebrow"></div>
          <h1 class="title serif" id="day-title">Oggi</h1>
        </div>
        <button class="icon-btn glass" id="add-btn" aria-label="Aggiungi">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
      </div>
      <div class="days" id="days" role="tablist"></div>
    </header>
    <main class="timeline-wrap scroll" id="timeline-wrap">
      <div class="notices" id="notices"></div>
      <div class="timeline" id="timeline"></div>
    </main>
  </section>

  <!-- MEMORIA -->
  <section id="view-settings" class="view" aria-label="Memoria">
    <header class="top">
      <div class="top-row">
        <div><div class="eyebrow">Tempo</div><h1 class="title serif">Memoria</h1></div>
        <button class="icon-btn glass" data-goto="home" aria-label="Chiudi">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
    </header>
    <main class="settings scroll" id="settings"></main>
  </section>

  <nav class="dock" id="dock">
    <div class="tabbar glass" id="tabbar">
      <span class="tab-ind" id="tab-ind"></span>
      <button data-view="home" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="6" rx="2"/><rect x="4" y="14" width="16" height="6" rx="2"/></svg><span>Oggi</span></button>
      <button data-view="chat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12Z"/></svg><span>Parla</span></button>
      <button data-view="day"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="17" rx="3"/><path d="M8 2v4M16 2v4M4 10h16M8 14h2M12 14h2M16 14h0M8 17h2M12 17h2"/></svg><span>Giornata</span></button>
    </div>
    <button class="fab glass" id="fab" aria-label="Nuova attività">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </nav>
</div>

<!-- Scheda modifica -->
<div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
  <div class="grabber"></div>
  <form id="sheet-form"></form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
