# Tempo Cloud su Cloudflare Workers (piano gratuito: 100.000 richieste al giorno).
#   npx wrangler kv namespace create TEMPO_KV      → copia l'id qui sotto
#   npx wrangler secret put TEMPO_SECRET            → almeno 32 caratteri casuali (openssl rand -base64 48)
#   npx wrangler deploy
name = "tempo-cloud"
main = "src/worker.js"
compatibility_date = "2026-09-01"

[[kv_namespaces]]
binding = "TEMPO_KV"
id = "INSERISCI_L_ID_DEL_NAMESPACE"

[vars]
# origini ammesse per l'app web (l'app nativa usa capacitor://localhost, già incluso)
TEMPO_ORIGINS = "https://davidebica10-design.github.io,capacitor://localhost,http://localhost,https://localhost"
